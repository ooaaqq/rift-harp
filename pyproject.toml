[project]
name = "rift-harp"
version = "0.1.0"
description = "HARP-Core+ singing voice conversion training stack"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.0.0",
    "torch==2.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[project.scripts]
harp-build-flow-transform = "harp.transform_cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harp"]

